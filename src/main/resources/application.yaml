spring:
  application:
    name: badminton-ranking

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/badminton_ranking
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000